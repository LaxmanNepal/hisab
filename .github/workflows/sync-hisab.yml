name: Sync Hisab from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Download current Google Sheet as XLSX
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
        run: |
          python - <<'PY'
          import io, json, os, pathlib
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["DRIVE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          file_id = os.environ["DRIVE_FILE_ID"]

          metadata = drive.files().get(
              fileId=file_id,
              fields="id,name,mimeType,modifiedTime",
          ).execute()

          print("Source:", metadata)
          pathlib.Path("/tmp/hisab-source-metadata.json").write_text(
              json.dumps({"source_name": metadata.get("name", "Google Sheet"), "source_modified_at": metadata.get("modifiedTime")}),
              encoding="utf-8",
          )

          output = pathlib.Path("Hisab.xlsx")
          mime = metadata.get("mimeType", "")

          # Your current source is a Google Sheets document, so export it as XLSX.
          if mime == "application/vnd.google-apps.spreadsheet":
              request = drive.files().export_media(
                  fileId=file_id,
                  mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              )
          else:
              request = drive.files().get_media(fileId=file_id)

          with output.open("wb") as fh:
              downloader = MediaIoBaseDownload(fh, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()

          if output.stat().st_size < 1000:
              raise SystemExit("Downloaded workbook is unexpectedly small.")
          print(f"Saved {output} ({output.stat().st_size} bytes)")
          PY

      - name: Generate public image and receipt manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          extensions = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}
          owner_repo = "LaxmanNepal/hisab"
          branch = "main"

          for folder in ("images", "receipts"):
              root = Path(folder)
              files = []
              if root.exists():
                  for path in sorted(root.iterdir(), key=lambda p: p.name.lower()):
                      if path.is_file() and path.suffix.lower() in extensions:
                          files.append({
                              "name": path.name,
                              "path": path.as_posix(),
                              "size": path.stat().st_size,
                              "download_url": f"https://raw.githubusercontent.com/{owner_repo}/{branch}/{path.as_posix()}",
                          })
              manifest = root / "manifest.json"
              manifest.write_text(json.dumps(files, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
              print(f"Generated {manifest}: {len(files)} image(s)")
          PY

      - name: Commit workbook and gallery manifests when changed
        run: |
          if git diff --quiet -- Hisab.xlsx images/manifest.json receipts/manifest.json && [ -f sync-status.json ]; then
            echo "Workbook and gallery manifests are already up to date."
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source_path = Path("/tmp/hisab-source-metadata.json")
          source = json.loads(source_path.read_text(encoding="utf-8")) if source_path.exists() else {}
          status = {
              "synced_at": datetime.now(timezone.utc).isoformat(),
              "source_name": source.get("source_name", "Google Sheet"),
              "source_modified_at": source.get("source_modified_at"),
              "meaning": "Last successful sync that published changed workbook or gallery data",
          }
          Path("sync-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          PY

          git config user.name "hisab-sync[bot]"
          git config user.email "hisab-sync[bot]@users.noreply.github.com"
          git add Hisab.xlsx images/manifest.json receipts/manifest.json sync-status.json
          git commit -m "Sync workbook and refresh gallery manifests"
          git push
